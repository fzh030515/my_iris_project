name: CI/CD Pipeline

on:
  pull_request:
    branches: [main, staging, dev]  # 在PR到受保护分支时触发

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run tests
        run: |
          pytest -v  # 运行测试套件
      - name: Lint code
        run: |
          pip install black   # 代码格式化工具
          black --check src/ tests/  # 检查代码格式

  build-docker:
    runs-on: ubuntu-latest
    needs: test  # 依赖test job
    steps:
      - name: Checkout code
        uses: actions/checkout
        